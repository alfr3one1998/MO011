plugins {
    id 'com.android.application'
}

android {
    namespace 'com.malfr3one.mandoub'
    compileSdk 37

    defaultConfig {
        applicationId 'com.malfr3one.mandoub'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
