plugins {
    id 'com.android.application'
}

android {
    namespace 'com.malfr3one.mandoub'
    compileSdk 36

    defaultConfig {
        applicationId 'com.malfr3one.mandoub'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '3.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
