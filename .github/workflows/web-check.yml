name: Verify Web App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'db/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
